<style>
  /* The real "visually hidden" accessibility pattern: kept in the a11y tree
     and in textContent, but invisible on screen via clip + absolute
     positioning rather than display:none. */
  .visually-hidden-always {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
