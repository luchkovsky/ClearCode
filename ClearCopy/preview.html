<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clear Copy Preview</title>
<link rel="stylesheet" href="preview.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="panel no-print" id="panel">
      <div class="panel-head">
        <div class="brand">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
          <span>Clear Copy</span>
        </div>
        <button class="icon-btn" id="collapseBtn" title="Hide panel" aria-label="Hide panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
      </div>

      <div class="panel-body">
        <section class="group">
          <h3>Source</h3>
          <div class="seg two" role="radiogroup" id="source">
            <button role="radio" data-value="page">This page</button>
            <button role="radio" data-value="collection">Combined</button>
          </div>
          <p class="hint" id="sourceHint"></p>

          <div class="collected" id="collected" hidden>
            <ol class="collected-list" id="collectedList"></ol>
            <div class="collected-actions">
              <button class="mini-btn" id="addCurrent">Add current page</button>
              <button class="mini-btn danger" id="clearCollected">Clear</button>
            </div>
          </div>
        </section>

        <section class="group">
          <h3>Document type</h3>
          <div class="seg two" role="radiogroup" id="docType">
            <button role="radio" data-value="article" title="Just what is open now — one continuous page">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
              <span>Article</span>
            </button>
            <button role="radio" data-value="book" title="Everything opened out — every tab and step, paginated">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
              <span>Book</span>
            </button>
          </div>
          <p class="hint" id="docTypeHint"></p>
        </section>

        <section class="group">
          <h3>Style</h3>
          <div class="seg two" role="radiogroup" id="style">
            <button role="radio" data-value="reader">Reader</button>
            <button role="radio" data-value="faithful">Faithful</button>
          </div>
          <p class="hint" id="styleHint"></p>
        </section>

        <section class="group">
          <h3>Page</h3>
          <div class="row">
            <label for="paper">Paper</label>
            <select id="paper"></select>
          </div>
          <div class="row">
            <label for="orientation">Orientation</label>
            <select id="orientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </div>
          <div class="row">
            <label for="margin">Margins</label>
            <select id="margin"></select>
          </div>
          <div class="row" data-hide-for="article">
            <label for="columns">Columns</label>
            <select id="columns">
              <option value="1">Single</option>
              <option value="2">Two</option>
            </select>
          </div>
        </section>

        <section class="group">
          <h3>Typography</h3>
          <div class="row">
            <label for="font">Typeface</label>
            <select id="font"></select>
          </div>
          <div class="row">
            <label for="fontSize">Size</label>
            <input type="range" id="fontSize" min="8" max="18" step="0.5">
            <output id="fontSizeOut"></output>
          </div>
          <div class="row">
            <label for="lineHeight">Leading</label>
            <input type="range" id="lineHeight" min="1.2" max="2.2" step="0.05">
            <output id="lineHeightOut"></output>
          </div>
          <div class="row">
            <label for="theme">Theme</label>
            <select id="theme"></select>
          </div>
        </section>

        <section class="group">
          <h3>Content</h3>
          <label class="check"><input type="checkbox" id="keepImages"> <span>Include images</span></label>
          <label class="check indent"><input type="checkbox" id="onlySignificantImages"> <span>Meaningful images only</span></label>
          <p class="hint" id="imageHint"></p>
          <label class="check"><input type="checkbox" id="keepInteractionPrompts"> <span>Keep “click to…” prompts</span></label>
          <label class="check"><input type="checkbox" id="keepLinks"> <span>Show link styling</span></label>
          <label class="check"><input type="checkbox" id="showHeader"> <span>Title block</span></label>
          <label class="check" data-hide-for="article"><input type="checkbox" id="showFooter"> <span>Page numbers</span></label>
          <label class="check"><input type="checkbox" id="hyphenate"> <span>Hyphenation</span></label>
        </section>
      </div>

      <div class="panel-foot">
        <button class="btn primary" id="savePdf">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          Save PDF
        </button>
        <button class="btn" id="saveMd">Save Markdown</button>
        <button class="btn ghost" id="copyMd">Copy Markdown</button>
        <p class="status" id="status"></p>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="stage-bar no-print">
        <button class="icon-btn" id="expandBtn" title="Show panel" aria-label="Show panel" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="doc-info" id="docInfo"></div>
        <button class="icon-btn" id="refreshBtn" title="Re-read the page (use after clicking Launch/Relaunch)" aria-label="Re-read the page">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="walkCourseBtn" title="Capture every lesson in the course menu as one book" aria-label="Capture whole course" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </button>
        <div class="zoom">
          <button class="icon-btn" id="zoomOut" aria-label="Zoom out">−</button>
          <span id="zoomLevel">100%</span>
          <button class="icon-btn" id="zoomIn" aria-label="Zoom in">+</button>
          <button class="icon-btn" id="zoomFit" title="Fit width">Fit</button>
        </div>
      </div>

      <div class="scroll" id="scroll">
        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p id="loadingText">Reading page…</p>
        </div>
        <div class="paper-wrap" id="paperWrap" hidden></div>
      </div>
    </main>
  </div>

  <script type="module" src="preview.js"></script>
</body>
</html>
