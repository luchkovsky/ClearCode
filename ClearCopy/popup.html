<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Clear Copy</title>
<style>
  :root {
    --bg: #1a1d23;
    --raised: #23272f;
    --border: #2e333c;
    --fg: #e6e8ec;
    --muted: #9099a6;
    --accent: #4c8dff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff; --raised: #f0f2f5; --border: #dfe2e8;
      --fg: #1b1e23; --muted: #646b76;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 268px;
    margin: 0;
    padding: 14px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    font-weight: 600;
    color: var(--accent);
  }
  .tagline {
    margin: 0 0 14px;
    font-size: 11.5px;
    color: var(--muted);
    line-height: 1.4;
  }
  .btn {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 7px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--raised);
    color: var(--fg);
    font: inherit;
    font-size: 12.5px;
    font-weight: 550;
    text-align: left;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn svg { flex: 0 0 16px; }
  .btn small {
    display: block;
    font-weight: 400;
    font-size: 10.5px;
    opacity: .75;
    margin-top: 1px;
  }
  .status {
    margin: 8px 0 0;
    min-height: 14px;
    font-size: 11px;
    text-align: center;
    color: var(--muted);
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 12px 0 10px;
  }
  .collection {
    margin-top: 4px;
    padding: 10px;
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .collection-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
  }
  .link-btn {
    border: 0;
    background: none;
    padding: 0;
    font: inherit;
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
  }
  .collection-list {
    margin: 0 0 9px;
    padding-left: 18px;
    max-height: 132px;
    overflow-y: auto;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--fg);
  }
  .collection-list li { margin-bottom: 2px; }
  .collection-list .remove {
    border: 0; background: none; color: var(--muted);
    cursor: pointer; font: inherit; padding: 0 0 0 4px;
  }
  .collection-list .remove:hover { color: #d95c5c; }
  .collection .btn { margin-bottom: 0; }
  .collection-list .tag {
    display: inline-block; background: var(--accent); color: #fff;
    border-radius: 3px; padding: 0 4px; margin-right: 4px;
    font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .04em; vertical-align: 1px;
  }
  /* Scoped so it does not override the accent-coloured .link-btn above. */
  .footer-link { margin: 10px 0 0; text-align: center; }
  .footer-link .link-btn { font-size: 11.5px; color: var(--muted); }
  .footer-link .link-btn:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="brand">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
    <span>Clear Copy</span>
  </div>
  <p class="tagline">Expands hidden content, then builds a clean document you can shape before saving.</p>

  <button class="btn primary" id="openPreview">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>Open preview<small>Choose format, then export</small></span>
  </button>

  <div class="divider"></div>

  <button class="btn" id="addToCollection">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    <span>Add this page<small id="addHint">Collect lessons, export as one PDF</small></span>
  </button>

  <button class="btn" id="addSelection">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M8 9h8M8 13h5"/></svg>
    <span>Add selection<small id="selectionHint">Collect just the highlighted text</small></span>
  </button>

  <div class="collection" id="collection" hidden>
    <div class="collection-head">
      <span id="collectionCount"></span>
      <button class="link-btn" id="clearCollection">Clear</button>
    </div>
    <ol class="collection-list" id="collectionList"></ol>
    <button class="btn primary" id="exportCollection">Export all as one document</button>
  </div>

  <p class="status" id="status"></p>
  <p class="footer-link"><button class="link-btn" id="openOptions">Settings &amp; shortcuts</button></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
